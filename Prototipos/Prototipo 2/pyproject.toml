# Dependencias de las funciones de Vercel (carpeta api/: solver del modo desarrollador y
# documentos para descargar).
# El proyecto de Vercel usa esta carpeta como Root Directory; el motor está en notebooks/, fuera
# de ella, así que se instala como paquete desde esa ruta (siempre el código del mismo commit).
[project]
name = "horarios-mmdd-prototipo-2"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "horarios-mmdd",            # notebooks/ (ver [tool.uv.sources])
    "ortools==9.15.6755",       # modelo matemático (CP-SAT, HiGHS, SCIP, CBC)
    "gurobipy==13.0.3",         # modelo matemático con Gurobi (licencia WLS en variables de entorno)
    "openpyxl==3.1.5",          # horarios en Excel (formato de HORARIO CURSOS 2026.xlsx)
    "python-docx==1.2.0",       # horarios y distribución horaria docente en Word
    "reportlab==5.0.0",         # horarios y distribución horaria docente en PDF
    "pillow==12.3.0",           # escudo del colegio en los documentos
]

[tool.uv.sources]
horarios-mmdd = { path = "../../notebooks", editable = false }
